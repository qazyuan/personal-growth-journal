openapi: 3.1.0
info:
  title: Personal Growth Journal API
  version: 0.2.0
security:
  - supabaseBearer: []
paths:
  /api/entries:
    get:
      summary: List active entries in reverse chronological order
      responses:
        "200":
          description: Entry list
    post:
      summary: Create an entry idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntryRequest"
      responses:
        "201":
          description: Entry created
        "409":
          description: Idempotency or entry conflict
  /api/analyses:
    get:
      summary: List analysis states and persisted results for recent entries
      responses:
        "200":
          description: Analysis state map keyed by entry ID
  /api/entries/{id}:
    delete:
      summary: Soft-delete an entry and remove it from the active timeline
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Entry marked as deleted
        "404":
          description: Entry not found or not owned by the current user
        "503":
          description: Delete migration required
  /api/entries/{id}/analysis:
    post:
      summary: Run or retry the requested analysis for one entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Analysis completed or an existing result returned
        "202":
          description: Another request is already analyzing this entry
        "503":
          description: Database migration or AI provider configuration required
  /api/entries/{id}/conversation:
    get:
      summary: Load the reflection conversation bound to an entry revision
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Conversation and ordered messages
    post:
      summary: Append one user turn and generate one grounded assistant response
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated conversation
        "409":
          description: Previous turn still running
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [id, operationId, occurredAt, localDate, timezone, source, mode, content]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        localDate: { type: string, format: date }
        timezone: { type: string, example: Asia/Shanghai }
        source: { type: string, enum: [iphone, mac_web, ipad_web, import] }
        mode: { type: string, enum: [record_only, record_and_analyze] }
        content: { type: string, minLength: 1, maxLength: 20000 }
    AnalysisState:
      type: object
      required: [entryId, status]
      properties:
        entryId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        result: { type: object }
        message: { type: string }
